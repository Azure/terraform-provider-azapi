schema_version: 1
repository: Azure/terraform-provider-azapi
profile:
  base_branch: main
  kind: terraform-provider
  module_root: internal
  target_kind: provider
  workflow: analysis-only
  live_test: false
  live_test_workflow: null
  triage_agent: tf_requirements
  triage_handoffs:
    sufficient: tf_analyzer
  triage_labels: null
  needs_info_label: waiting-response
  title_style: terraform
  pr_doc_url: null
  triaged_label: triaged
  duplicate_label: duplicate
  upstream_label: upstream-api
  priority_triage: true
  project_priority_number: 1015
  live_repro: false
  live_repro_workflow: null
  coding_norms:
  - No breaking schema changes (removed or renamed attributes, changed types or new ForceNew behaviour)
    without a deprecation path for a major release.
  - Record user-visible changes in CHANGELOG.md following its existing format for the next release.
  - Never hand-edit generated files (marked `Code generated ... DO NOT EDIT`); change the generator input
    instead.
  pr_conventions:
    template_path: null
    heading: '##'
    sections:
    - name: Description
      content: description
    - name: Testing
      content: testing
    checklist: []
    issue_link: Fixes
    title_convention: Short imperative summary of the change.
    release_notes: CHANGELOG.md entry for the next release.
  contributor_docs:
  - https://github.com/Azure/terraform-provider-azapi/blob/main/CONTRIBUTING.md
  swe_replay: true
